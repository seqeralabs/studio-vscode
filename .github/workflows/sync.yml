# Wrapper that delegates to the central sync workflow in studio-templates.
name: Sync from studio-templates
on:
  workflow_dispatch:
    inputs:
      tool_version:
        description: "New tool (VSCode) version, e.g. 1.101.2"
        required: true
        type: string
      connect_version:
        description: "New connect-client version, e.g. 0.12"
        required: true
        type: string
      source_dir:
        description: "studio-templates docker/<dir> to mirror from, e.g. vscode_1.101.2"
        required: true
        type: string
      templates_ref:
        description: "studio-templates ref (branch/tag/SHA). Default: main."
        required: false
        type: string
        default: "main"

jobs:
  sync:
    uses: seqeralabs/studio-templates/.github/workflows/sync-studio-tool.yml@main
    with:
      image: "data-studio-vscode"
      tool_version: ${{ inputs.tool_version }}
      connect_version: ${{ inputs.connect_version }}
      source_dir: ${{ inputs.source_dir }}
      templates_ref: ${{ inputs.templates_ref }}
    secrets: inherit
